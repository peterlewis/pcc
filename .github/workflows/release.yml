name: Release pccd

# Push a tag like `pccd-v0.4` → this builds all three tarballs (each = the pccd binary next to a copy
# of the web app) + SHA256SUMS and publishes them as a GitHub Release. No more manual dist.sh + gh
# release create; the version and the download links stay in lockstep with the tag.
#
#   git tag pccd-v0.4 && git push origin pccd-v0.4
#
# The build recipe lives once in host/pccd/dist.sh — this workflow just calls it per-runner (macOS
# universal on a mac runner; the static-musl Linux binaries on ubuntu, aarch64 via qemu).

on:
  push:
    tags: ['pccd-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. pccd-v0.4) — must already exist'
        required: true

permissions:
  contents: write     # create the release + upload assets

jobs:
  # Build the web app ONCE (it's platform-independent) and share docs/ with the packaging jobs.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true              # the real 12 MB tzmap.bin, not the LFS pointer
          submodules: recursive  # web/emu/firmware = clock4 source → WASM at build time
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.2
          actions-cache-folder: emsdk-cache
      - working-directory: web
        run: npm install --no-audit --no-fund
      - working-directory: web
        run: node build.mjs      # → docs/
      - uses: actions/upload-artifact@v4
        with:
          name: pcc-web
          path: docs
          retention-days: 1

  macos:
    needs: web
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: pcc-web, path: docs }
      - run: bash host/pccd/dist.sh macos
      - uses: actions/upload-artifact@v4
        with: { name: tar-macos, path: host/pccd/dist/*.tar.gz, retention-days: 1 }

  linux:
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: pcc-web, path: docs }
      - uses: docker/setup-qemu-action@v3   # so the arm64 Alpine container can run on an x86_64 runner
      - run: bash host/pccd/dist.sh linux-x86_64
      - run: bash host/pccd/dist.sh linux-aarch64
      - uses: actions/upload-artifact@v4
        with: { name: tar-linux, path: host/pccd/dist/*.tar.gz, retention-days: 1 }

  release:
    needs: [macos, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { pattern: tar-*, path: assets, merge-multiple: true }
      - name: SHA256SUMS
        working-directory: assets
        run: sha256sum *.tar.gz | tee SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          # Prefer a committed notes file for this tag (host/pccd/RELEASE_NOTES_v0.4.md for pccd-v0.4);
          # otherwise auto-generate the changelog from commits/PRs.
          NOTES="host/pccd/RELEASE_NOTES_${TAG#pccd-}.md"
          if [ -f "$NOTES" ]; then NOTE_ARGS=(--notes-file "$NOTES"); else NOTE_ARGS=(--generate-notes); fi
          gh release create "$TAG" assets/*.tar.gz assets/SHA256SUMS \
            --title "pccd ${TAG#pccd-}" "${NOTE_ARGS[@]}"
