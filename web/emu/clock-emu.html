<!doctype html>
<meta charset="utf-8">
<title>PCC — firmware emulator (live)</title>
<style>
  :root{ --face-led:#ff4530; --face-dim:#3a1512; --face-glow:rgba(255,69,48,.55); --inset:#0a0c10; }
  body{ margin:0; background:#05070a; color:#c8d0dc; font:14px/1.5 ui-monospace,Menlo,monospace;
        display:flex; flex-direction:column; align-items:center; gap:14px; padding:24px; }
  h1{ font-size:15px; font-weight:600; color:#8ea0b6; margin:0; letter-spacing:.02em; }
  .tag{ color:#ff4530; font-weight:600; }
  #wrap{ width:min(92vw,760px); }
  canvas{ width:100%; aspect-ratio:760/300; display:block; border-radius:10px; }
  /* controls sit under the clock, on its horizontal axis */
  #ctl{ width:min(92vw,760px); display:flex; align-items:center; justify-content:space-between; gap:18px; flex-wrap:wrap; }
  .btns{ display:flex; gap:12px; }
  button{ background:#141922; color:#c8d0dc; border:1px solid #2a323f; border-radius:8px;
          padding:9px 16px; font:600 13px ui-monospace,Menlo,monospace; cursor:pointer; }
  button:hover{ border-color:#ff4530; color:#ff4530; }
  button:active{ transform:translateY(1px); }
  #sig.on{ border-color:#2f6b3a; color:#7fd08a; }
  #sig.off{ border-color:#7a2b24; color:#ff7a6b; }
  .bright{ display:flex; align-items:center; gap:8px; font-size:12px; color:#6f8298; }
  input[type=range]{ accent-color:#ff4530; width:120px; }
  /* GPS status strip */
  #gps{ width:min(92vw,760px); display:flex; align-items:center; gap:14px; font-size:12px;
        background:#0b0e13; border:1px solid #1b222c; border-radius:8px; padding:8px 12px; }
  .led{ width:9px; height:9px; border-radius:50%; background:#3a1512; box-shadow:0 0 0 transparent; }
  .led.acq{ background:#caa63a; box-shadow:0 0 8px #caa63a; }
  .led.lock{ background:#3fd06a; box-shadow:0 0 8px #3fd06a; }
  .led.hold{ background:#c86a3a; box-shadow:0 0 8px #c86a3a; }
  .led.dead{ background:#7a2b24; }
  #gstate{ font-weight:600; min-width:78px; }
  #gps .sep{ color:#333c48; }
  .k{ color:#5d6b7d; }
  #bars{ display:flex; align-items:flex-end; gap:2px; height:16px; }
  #bars i{ width:4px; background:#2b3a2c; border-radius:1px; }
  #bars i.on{ background:#3fd06a; }
  #hud{ width:min(92vw,760px); font-size:12px; color:#6f8298; }
  #mode{ color:#ff4530; }
</style>
<h1>Precision Clock Mk IV — <span class="tag">real firmware</span> + <span class="tag">virtual GPS</span> in WebAssembly</h1>
<div id="wrap"><canvas id="face"></canvas></div>

<div id="gps">
  <span class="led" id="gled"></span>
  <span id="gstate">BOOTING</span>
  <span class="sep">·</span>
  <span><span class="k">sats</span> <b id="gsats">0</b></span>
  <span id="bars"></span>
  <span class="sep">·</span>
  <span><span class="k">fix</span> <b id="gfix">—</b></span>
  <span class="sep">·</span>
  <span><span class="k">PPS</span> <b id="gpps">—</b></span>
  <span class="sep">·</span>
  <span id="gnmea" class="k" style="margin-left:auto; opacity:.8"></span>
</div>

<div id="ctl">
  <div class="btns">
    <button id="b1" title="cycle mode forward">Button&nbsp;1 ▸</button>
    <button id="b2" title="cycle mode back">◂ Button&nbsp;2</button>
    <button id="sig" class="on" title="toggle the GPS antenna signal">GPS&nbsp;signal:&nbsp;ON</button>
  </div>
  <label class="bright">detected brightness
    <input id="bright" type="range" min="0" max="4095" value="2600">
  </label>
</div>
<div id="hud">booting firmware…</div>

<script type="module">
import { createClockFace, CLOCKFACE_CORE } from '../js/clockface.js?v=91';
import factory from './clock-fw.mjs?v=4';
import { VirtualGPS } from './sim-gps.mjs?v=1';

const LUT = CLOCKFACE_CORE.LUT_TIME;
const decode = (b) => { const p=b&0x7f; if(p===0)return 'BLANK'; if(p===0b1000000)return 'DASH';
  const d=LUT.indexOf(p); return d<0?'DASH':d; };

const M = await factory();
const w = (n,r='void',a=[]) => M.cwrap(n,r,a);
const emu = {
  bootCold:w('emu_boot_cold','void',['number']), tick:w('emu_tick'), poll:w('emu_poll'),
  now:w('emu_now','number'), mode:w('emu_mode','number'),
  button1:w('emu_button1'), button2:w('emu_button2'), enable:w('emu_enable_mode','void',['number']),
  setAdc:w('emu_set_adc','void',['number']),
  feedNmea:w('emu_feed_nmea','void',['string']), pps:w('emu_pps'),
  pendsv:w('emu_pendsv'), pendsvPending:w('emu_pendsv_pending','number'),
  flags:w('emu_flags','number'), hadPps:w('emu_had_pps','number'),
  sincePps:w('emu_since_pps','number'), satcount:w('emu_satcount','number'),
  daterow:w('emu_daterow','number'), bufb:w('emu_bufb','number',['number']),
  bufcLo:w('emu_bufc_low','number',['number']), bufcHi:w('emu_bufc_high','number',['number']),
};
const LST=w('emu_MODE_LST','number')(), SOL=w('emu_MODE_SOLAR','number')();
const MODE_NAMES={0:'ISO 8601',3:'UNIX',8:'WEEKDAY',[LST]:'SIDEREAL (LST)',[SOL]:'SOLAR'};
const cSegDP=0b00010000;

function readFrame(){
  const big=[decode(emu.bufb(0)>>2),decode(emu.bufb(1)>>2),decode(emu.bufb(2)>>2),
             decode(emu.bufb(3)>>2),decode(emu.bufb(4)>>2),decode(emu.bufcLo(0))];
  const small=[decode(emu.bufcLo(1)),decode(emu.bufcLo(2)),decode(emu.bufcLo(3))];
  const dp=(emu.bufcHi(0)&cSegDP)!==0;
  const p=emu.daterow(); let dateRow='';
  // date row is '\n'-terminated (firmware writes it at position i+1); bytes after are stale.
  for(let i=1;i<=10;i++){const c=M.HEAPU8[p+i]; if(c===0x0a||c===0)break; dateRow+=c>=32&&c<127?String.fromCharCode(c):' ';}
  return { dateRow: dateRow.replace(/\s+$/,''), time:{mode:'cells',big,small,dp,colonsOn:true} };
}

// --- boot COLD (no fix, no pulse) and let the virtual GPS bring it to lock -----------------
const bootEpoch = Math.floor(Date.now()/1000);
emu.bootCold(bootEpoch);
[0,3,8,LST,SOL].forEach(emu.enable);   // ISO, UNIX, WEEKDAY, sidereal, solar in the cycle
emu.setAdc(2600);
const gps = new VirtualGPS(emu, { lat:51.4779, lon:-0.0015, acquireSec:6 });  // Greenwich

const face=createClockFace(document.getElementById('face'),{rows:['date','time'],colonMode:'heartbeat',precision:3});
face.setBrightness(0.25+0.75*2600/4095);

const $=(id)=>document.getElementById(id);
$('b1').onclick=()=>{ emu.button1(); if(emu.pendsvPending())emu.pendsv(); };
$('b2').onclick=()=>{ emu.button2(); if(emu.pendsvPending())emu.pendsv(); };
$('sig').onclick=()=>{ const on=!gps.signal; gps.setSignal(on);
  $('sig').textContent='GPS signal: '+(on?'ON':'OFF'); $('sig').className=on?'on':'off'; };
$('bright').oninput=(e)=>{ const v=+e.target.value; emu.setAdc(v); face.setBrightness(0.25+0.75*v/4095); };

// signal-strength bars
const bars=$('bars'); for(let i=0;i<11;i++){const b=document.createElement('i'); b.style.height=(5+i)+'px'; bars.appendChild(b);}

let lastNmea='';
const _feed=emu.feedNmea;
emu.feedNmea=(s)=>{ lastNmea=s.trim(); _feed(s); };   // tap for the HUD

function paintGps(){
  const fl=emu.flags(), sats=emu.satcount(), st=gps.state;
  const led=$('gled'); led.className='led '+(!gps.signal?'dead':st==='LOCKED'?'lock':st==='ACQUIRING'?'acq':'hold');
  $('gstate').textContent = !gps.signal?'NO SIGNAL':st;
  $('gsats').textContent = sats;
  [...bars.children].forEach((b,i)=>b.className = i<sats?'on':'');
  $('gfix').textContent = (fl&1)?'A (valid)':'searching';
  $('gpps').textContent = emu.hadPps()?`locked · ${emu.sincePps()}s ago`:'—';
  $('gnmea').textContent = lastNmea;
}

let last=performance.now(), acc=0;
function frame(t){
  let dtMs=t-last; last=t;
  if (dtMs>250) dtMs=250;   // backgrounded/stalled: bound the catch-up so the 1 kHz tick clock
                            // and the virtual-GPS clock advance together and never desync
                            // (RMC re-disciplines currentTime within ~1 s on refocus)
  acc+=dtMs; let steps=acc|0; acc-=steps;
  while(steps-->0){ emu.tick(); if(emu.pendsvPending())emu.pendsv(); }   // real 1 kHz SysTick
  gps.advance(dtMs/1000, new Date());   // virtual GPS: PPS + NMEA into the real firmware
  emu.poll();                            // main-loop housekeeping (alt-timebase staging)
  face.applyDeviceFrame(readFrame());
  paintGps();
  const m=emu.mode();
  $('hud').innerHTML=`mode: <span id="mode">${MODE_NAMES[m]||('#'+m)}</span> · `+
    `firmware currentTime=${emu.now()} · ${new Date(emu.now()*1000).toUTCString()} · real clock4 @ 1 kHz`;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.__emu={M,emu,gps};
</script>
