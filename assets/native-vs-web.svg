<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 600" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, Consolas, monospace">
  <!-- self-contained dark panel so it reads on GitHub light AND dark themes -->
  <rect x="1" y="1" width="918" height="598" rx="16" fill="#0a0e14" stroke="#1d2530" stroke-width="1.5"/>

  <!-- title -->
  <text x="460" y="58" text-anchor="middle" fill="#e6edf3" font-size="30" font-weight="700" letter-spacing="2">MAC APP? CBA.</text>
  <text x="460" y="88" text-anchor="middle" fill="#7d8896" font-size="14" letter-spacing="1">why the Precision Clock Companion is a website, not a native app</text>

  <!-- circles -->
  <circle cx="360" cy="350" r="188" fill="rgba(125,136,150,0.09)" stroke="#4b5563" stroke-width="1.5"/>
  <circle cx="560" cy="350" r="188" fill="rgba(255,90,77,0.11)" stroke="#ff5a4d" stroke-width="1.6"/>

  <!-- circle labels -->
  <text x="250" y="196" text-anchor="middle" fill="#9aa4b0" font-size="15" font-weight="700" letter-spacing="1.5">NATIVE macOS APP</text>
  <text x="668" y="196" text-anchor="middle" fill="#ff8378" font-size="15" font-weight="700" letter-spacing="1.5">WEB APP · THIS</text>

  <!-- left lobe: the road not taken (dimmed) -->
  <g fill="#8b95a1" font-size="14.5">
    <text x="196" y="262">Xcode + Swift</text>
    <text x="196" y="298">$99/yr dev program</text>
    <text x="196" y="334">sign + notarize builds</text>
    <text x="196" y="370">Gatekeeper warnings</text>
    <text x="196" y="406">macOS only</text>
  </g>

  <!-- right lobe: the chosen path (bright) -->
  <g fill="#d7dee6" font-size="14.5">
    <text x="576" y="262">any Chromium browser</text>
    <text x="576" y="298">Web Serial · no install</text>
    <text x="576" y="334">zero code-signing</text>
    <text x="576" y="370">runs anywhere</text>
    <text x="576" y="406">tech I actually know</text>
  </g>

  <!-- intersection: the shared purpose -->
  <text x="460" y="338" text-anchor="middle" fill="#c7d0da" font-size="13" letter-spacing="0.5">drives your</text>
  <text x="460" y="360" text-anchor="middle" fill="#e6edf3" font-size="15" font-weight="700" letter-spacing="0.5">Mk IV</text>

  <!-- footer caption -->
  <text x="460" y="566" text-anchor="middle" fill="#6b7480" font-size="14" font-style="italic">same clock. one of these ships itself.</text>
</svg>
