<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 22 34" width="11" height="17">
  <!-- 7-segment "8" with chamfered hexagonal segments matching Precision Clock Mk IV -->

  <!-- a: top horizontal -->
  <polygon points="5,2 7,0 15,0 17,2 15,4 7,4" fill="black"/>

  <!-- f: top-left vertical -->
  <polygon points="2,5 4,7 4,13 2,15 0,13 0,7" fill="black"/>

  <!-- b: top-right vertical -->
  <polygon points="20,5 22,7 22,13 20,15 18,13 18,7" fill="black"/>

  <!-- g: middle horizontal -->
  <polygon points="5,17 7,15 15,15 17,17 15,19 7,19" fill="black"/>

  <!-- e: bottom-left vertical -->
  <polygon points="2,19 4,21 4,27 2,29 0,27 0,21" fill="black"/>

  <!-- c: bottom-right vertical -->
  <polygon points="20,19 22,21 22,27 20,29 18,27 18,21" fill="black"/>

  <!-- d: bottom horizontal -->
  <polygon points="5,32 7,30 15,30 17,32 15,34 7,34" fill="black"/>
</svg>
